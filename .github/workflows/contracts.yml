name: contracts

on:
  push:
    paths:
      - "shared/**"
      - "infrastructure/config/sources/**"
      - "pyproject.toml"
      - "uv.lock"
      - "makefile"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "shared/**"
      - "infrastructure/config/sources/**"
      - "pyproject.toml"
      - "uv.lock"
      - "makefile"
      - ".github/workflows/contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Validate contracts and schema
        run: make contracts-check
