name: infra

on:
  push:
    paths:
      - "backend/**"
      - "demo-harness/**"
      - "database/**"
      - "infrastructure/**"
      - "observability/**"
      - "pyproject.toml"
      - "uv.lock"
      - "makefile"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "backend/**"
      - "demo-harness/**"
      - "database/**"
      - "infrastructure/**"
      - "observability/**"
      - "pyproject.toml"
      - "uv.lock"
      - "makefile"
      - ".github/workflows/infra.yml"

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Test
        run: make test
      - name: Compose config
        run: make compose-check
