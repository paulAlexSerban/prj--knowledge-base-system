[project]
name = "harness-product"
version = "0.1.0"
description = "Product harness. Markdown specs and a best-effort webhook."
requires-python = ">=3.12"
dependencies = ["harness-common"]

[tool.uv.sources]
harness-common = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
