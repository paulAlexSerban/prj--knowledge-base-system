[project]
name = "harness-engineering"
version = "0.1.0"
description = "Engineering harness. Jira-like epics with an updated_since feed."
requires-python = ">=3.12"
dependencies = [
  "harness-common",
  "sqlalchemy>=2.1.4",
]

[tool.uv.sources]
harness-common = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
