[project]
name = "harness-common"
version = "0.1.0"
description = "Shared SQLAlchemy and change-feed helpers for the department harnesses."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "prometheus-client>=0.26.0",
  "shared",
  "sqlalchemy>=2.1.4",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
shared = { workspace = true }
