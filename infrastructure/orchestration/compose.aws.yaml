# AWS emulator. SQS and S3 share one floci process, so this project is
# separate from ingestion and the knowledge store. terraform-apply is a
# one-shot container: it applies infrastructure/provisioning/terraform to
# floci with throwaway state. floci keeps data in memory, so empty state is
# the correct starting point and a stale state file cannot exist.
# floci-ready is the in-compose signal that floci answered.

services:
  floci:
    image: floci/floci:latest
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: memory
    ports:
      - "127.0.0.1:4566:4566"
    networks: [kbs-aws]

  floci-ready:
    image: curlimages/curl:8.11.1
    depends_on:
      floci:
        condition: service_started
    networks: [kbs-aws]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while [ "$$i" -lt 30 ]; do
          if curl -s -o /dev/null --max-time 2 http://floci:4566/; then
            exit 0
          fi
          i=$$((i + 1))
          sleep 2
        done
        exit 1
    restart: "no"

  terraform-apply:
    image: hashicorp/terraform:1.9
    depends_on:
      floci-ready:
        condition: service_completed_successfully
    volumes:
      - ../provisioning/terraform:/src:ro
    networks: [kbs-aws]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir /work
        cp /src/*.tf /src/.terraform.lock.hcl /work/
        cd /work
        terraform init -input=false
        terraform apply -input=false -auto-approve -var aws_endpoint=http://floci:4566
    restart: "no"

networks:
  kbs-aws:
    external: true
    name: kbs-aws
