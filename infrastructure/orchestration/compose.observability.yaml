services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    networks: [kbs-obs]
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  loki:
    image: grafana/loki:3.7.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [kbs-obs]
    # No host port. Grafana is the way to read logs.
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  tempo:
    build:
      context: ../../observability/tempo
      dockerfile: Dockerfile
    image: kbs-tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [kbs-obs]
    # No host port. Grafana is the way to read traces.
    # The upstream image has no shell. /bin/busybox is the only extra binary.
    healthcheck:
      test:
        [
          "CMD",
          "/bin/busybox",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3200/ready",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  alloy:
    image: grafana/alloy:v1.20.1
    # Root is required to read the Docker socket. The image has no wget;
    # the ready check is a short HTTP read from bash.
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Trust-boundary exception. Read-only Docker socket so Alloy can tail
      # stdout from containers that are not on kbs-obs. Alloy joins kbs-obs
      # only. See ADR 0002.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [kbs-obs]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Local default. Override with GRAFANA_ADMIN_PASSWORD. The port stays on 127.0.0.1.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # UI edits live in Grafana's database. The dashboards bind mount overlays
      # this volume, so the committed JSON stays the file source.
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [kbs-obs]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

networks:
  kbs-obs:
    external: true
    name: kbs-obs

volumes:
  loki-data:
  grafana-data:
  tempo-data:
