# Chat page. It calls the gateway REST API with a persona token and holds no store
# credentials. It never joins kbs-data. kbs-obs carries traces to Alloy and lets
# Alloy scrape the metrics port. Streamlit's own port has no /metrics endpoint.

services:
  chat-ui:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    environment:
      GATEWAY_API_URL: http://gateway-api:8000
      CHAT_PERSONAS: employee_eng,hr_admin,outsider,product_lead
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:3000}
      HOME: /tmp
    networks: [kbs-sources, kbs-obs]
    ports:
      - "127.0.0.1:8501:8501"
    expose:
      - "9105"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  kbs-sources:
    external: true
    name: kbs-sources
  kbs-obs:
    external: true
    name: kbs-obs
