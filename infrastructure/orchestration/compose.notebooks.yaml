# Local notebooks. They call the harness and the gateway over HTTP and never
# join kbs-data, so they cannot reach Postgres or Neo4j. Jupyter has no
# /metrics endpoint and is not a Prometheus target.

services:
  jupyter:
    build:
      context: ../..
      dockerfile: notebooks/Dockerfile
    command:
      [
        "jupyter", "lab",
        "--ip=0.0.0.0",
        "--port=8888",
        "--no-browser",
        "--ServerApp.root_dir=/notebooks",
        "--allow-root",
        "--IdentityProvider.token=${JUPYTER_TOKEN:-dev-only-notebook}",
      ]
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-dev-only-notebook}
      HARNESS_HR_URL: http://harness-hr:8080
      HARNESS_SALES_URL: http://harness-sales:8080
      HARNESS_PRODUCT_URL: http://harness-product:8080
      HARNESS_ENGINEERING_URL: http://harness-engineering:8080
      SALES_METRICS_URL: http://connector-sales:9103/metrics
      PRODUCT_METRICS_URL: http://connector-product:9104/metrics
      ENGINEERING_METRICS_URL: http://connector-engineering:9102/metrics
      GATEWAY_API_URL: http://gateway-api:8000
      GATEWAY_MCP_URL: http://gateway-mcp:8001/mcp
      LOKI_URL: http://loki:3100
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      CONNECTOR_METRICS_URL: http://connector-hr:9100/metrics
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RAW_BUCKET: kbs-raw-snapshots
    volumes:
      - ../../notebooks:/notebooks
    networks: [kbs-sources, kbs-obs, kbs-aws]
    ports: ["127.0.0.1:8888:8888"]
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8888/api/status', headers={'Authorization': 'token ' + os.environ['JUPYTER_TOKEN']}))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  kbs-sources:
    external: true
    name: kbs-sources
  kbs-obs:
    external: true
    name: kbs-obs
  kbs-aws:
    external: true
    name: kbs-aws
