services:
  harness-hr:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: harness-hr
        ENTRYPOINT_MODULE: harness_hr
        # The SQLite volume at /data is writable as root. This is a local harness.
        APP_USER: root
    environment:
      SERVICE: hr
      PORT: "8080"
      SQLITE_PATH: /data/harness.db
      FILES_DIR: /data/policies
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    command: ["python", "-m", "harness_hr"]
    volumes: [hrdata:/data]
    networks: [kbs-sources, kbs-obs]
    ports: ["127.0.0.1:8101:8080"]
    healthcheck: &health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  harness-sales:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: harness-sales
        ENTRYPOINT_MODULE: harness_sales
        APP_USER: root
    environment:
      SERVICE: sales
      PORT: "8080"
      SQLITE_PATH: /data/harness.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    volumes: [salesdata:/data]
    networks: [kbs-sources, kbs-obs]
    ports: ["127.0.0.1:8102:8080"]
    healthcheck: *health

  harness-product:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: harness-product
        ENTRYPOINT_MODULE: harness_product
        APP_USER: root
    environment:
      SERVICE: product
      PORT: "8080"
      SQLITE_PATH: /data/harness.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      FILES_DIR: /data/specs
      WEBHOOK_URL: http://webhook-receiver:8090/webhooks/product
    volumes: [productdata:/data]
    networks: [kbs-sources, kbs-obs]
    ports: ["127.0.0.1:8103:8080"]
    healthcheck: *health

  harness-engineering:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: harness-engineering
        ENTRYPOINT_MODULE: harness_engineering
        APP_USER: root
    environment:
      SERVICE: engineering
      PORT: "8080"
      SQLITE_PATH: /data/harness.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    volumes: [engineeringdata:/data]
    networks: [kbs-sources, kbs-obs]
    ports: ["127.0.0.1:8104:8080"]
    healthcheck: *health

networks:
  kbs-sources:
    external: true
    name: kbs-sources
  kbs-obs:
    external: true
    name: kbs-obs

volumes:
  hrdata:
  salesdata:
  productdata:
  engineeringdata:
