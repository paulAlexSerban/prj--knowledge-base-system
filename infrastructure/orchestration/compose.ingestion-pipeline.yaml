services:
  connector-hr:
    build:
      context: ../..
      dockerfile: backend/connectors/hr/Dockerfile
    command: ["python", "-m", "connector_hr"]
    environment:
      CONTRACTS_DIR: /contracts
      METRICS_PORT: "9100"
      # P0 target is 30s. Scheduler cannot fire inside a minute, so the loop is 10s.
      P0_POLL_SECONDS: "10"
      RECONCILE_SECONDS: "60"
      SYNC_WORKERS: "8"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RAW_BUCKET: kbs-raw-snapshots
      HARNESS_HR_URL: http://harness-hr:8080
      POSTGRES_HOST: postgres
      POSTGRES_DB: kbs
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    volumes:
      - ../config/sources:/contracts:ro
    networks: [kbs-data, kbs-sources, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ingestion-worker:
    build:
      context: ../..
      dockerfile: backend/workers/ingestion-worker/Dockerfile
    command: ["python", "-m", "ingestion_worker"]
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      METRICS_PORT: "9101"
    networks: [kbs-data, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9101:9101"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  webhook-receiver:
    build:
      context: ../..
      dockerfile: backend/apis/webhook-receiver/Dockerfile
    command: ["python", "-m", "webhook_receiver"]
    networks: [kbs-sources, kbs-obs]
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  kbs-data:
    external: true
    name: kbs-data
  kbs-sources:
    external: true
    name: kbs-sources
  kbs-aws:
    external: true
    name: kbs-aws
  kbs-obs:
    external: true
    name: kbs-obs
