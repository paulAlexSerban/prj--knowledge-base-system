# floci-ready is defined with the emulator. Include it so this file stays valid
# on its own, and so the connector and worker wait until floci answers.
include:
  - path: compose.aws.yaml

services:
  connector-hr:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: connector-hr
        ENTRYPOINT_MODULE: connector_hr
    command: ["python", "-m", "connector_hr"]
    depends_on:
      floci-ready:
        condition: service_completed_successfully
    environment:
      CONTRACTS_DIR: /contracts
      METRICS_PORT: "9100"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      # P0 target is 30s. Scheduler cannot fire inside a minute, so the loop is 10s.
      P0_POLL_SECONDS: "10"
      RECONCILE_SECONDS: "60"
      SYNC_WORKERS: "8"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RAW_BUCKET: kbs-raw-snapshots
      HARNESS_HR_URL: http://harness-hr:8080
      POSTGRES_HOST: postgres
      POSTGRES_DB: kbs
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    volumes:
      - ../config/sources:/contracts:ro
    networks: [kbs-data, kbs-sources, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  connector-engineering:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: connector-engineering
        ENTRYPOINT_MODULE: connector_engineering
    command: ["python", "-m", "connector_engineering"]
    depends_on:
      floci-ready:
        condition: service_completed_successfully
    environment:
      CONTRACTS_DIR: /contracts
      METRICS_PORT: "9102"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      # P1. Sixty seconds is inside the freshness target. HR stays on the faster loop.
      POLL_SECONDS: "60"
      RECONCILE_SECONDS: "60"
      SYNC_WORKERS: "4"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RAW_BUCKET: kbs-raw-snapshots
      HARNESS_ENGINEERING_URL: http://harness-engineering:8080
      POSTGRES_HOST: postgres
      POSTGRES_DB: kbs
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    volumes:
      - ../config/sources:/contracts:ro
    networks: [kbs-data, kbs-sources, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9102:9102"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  connector-sales:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: connector-sales
        ENTRYPOINT_MODULE: connector_sales
    command: ["python", "-m", "connector_sales"]
    depends_on:
      floci-ready:
        condition: service_completed_successfully
    environment:
      CONTRACTS_DIR: /contracts
      METRICS_PORT: "9103"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      POLL_SECONDS: "60"
      RECONCILE_SECONDS: "60"
      SYNC_WORKERS: "4"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RAW_BUCKET: kbs-raw-snapshots
      HARNESS_SALES_URL: http://harness-sales:8080
      POSTGRES_HOST: postgres
      POSTGRES_DB: kbs
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    volumes:
      - ../config/sources:/contracts:ro
    networks: [kbs-data, kbs-sources, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9103:9103"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9103/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  connector-product:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: connector-product
        ENTRYPOINT_MODULE: connector_product
    command: ["python", "-m", "connector_product"]
    depends_on:
      floci-ready:
        condition: service_completed_successfully
    environment:
      CONTRACTS_DIR: /contracts
      METRICS_PORT: "9104"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      RECONCILE_SECONDS: "60"
      SYNC_WORKERS: "4"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      RAW_BUCKET: kbs-raw-snapshots
      HARNESS_PRODUCT_URL: http://harness-product:8080
      POSTGRES_HOST: postgres
      POSTGRES_DB: kbs
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    volumes:
      - ../config/sources:/contracts:ro
    networks: [kbs-data, kbs-sources, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9104:9104"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ingestion-worker:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: ingestion-worker
        ENTRYPOINT_MODULE: ingestion_worker
        BAKE_FASTEMBED: "1"
    command: ["python", "-m", "ingestion_worker"]
    depends_on:
      floci-ready:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      METRICS_PORT: "9101"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      CONTRACTS_DIR: /contracts
      RAW_BUCKET: kbs-raw-snapshots
      EMBEDDER: ${EMBEDDER:-fastembed}
      ORT_DISABLE_TELEMETRY: "1"
      # Only used if EMBEDDER is fastembed.
      # set higher for more diverse results and lower for more similar results
      VECTOR_MAX_DISTANCE: ${VECTOR_MAX_DISTANCE:-0.20}
      POSTGRES_HOST: postgres
      POSTGRES_DB: kbs
      POSTGRES_USER: ingestion_rw
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      RECONCILE_INDEX_SECONDS: "60"
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Set FAIL_OBJECT_ID to one object id to force that message onto the DLQ.
      FAIL_OBJECT_ID: ${FAIL_OBJECT_ID:-}
    volumes:
      - ../config/sources:/contracts:ro
    networks: [kbs-data, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9101:9101"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  webhook-receiver:
    build:
      context: ../..
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: webhook-receiver
        ENTRYPOINT_MODULE: webhook_receiver
    command: ["python", "-m", "webhook_receiver"]
    depends_on:
      floci-ready:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    networks: [kbs-sources, kbs-obs, kbs-aws]
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  kbs-data:
    external: true
    name: kbs-data
  kbs-sources:
    external: true
    name: kbs-sources
  kbs-aws:
    external: true
    name: kbs-aws
  kbs-obs:
    external: true
    name: kbs-obs
