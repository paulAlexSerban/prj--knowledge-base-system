x-backend: &backend
  build:
    context: ../..
    dockerfile: backend/Dockerfile

services:
  connector-worker:
    <<: *backend
    command: ["python", "-m", "backend.workers.connector_worker"]
    environment:
      CONTRACTS_DIR: /contracts
      METRICS_PORT: "9100"
      P0_POLL_SECONDS: "30"
    volumes:
      - ../config/sources:/contracts:ro
    networks: [kbs-data, kbs-sources, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ingestion-worker:
    <<: *backend
    command: ["python", "-m", "backend.workers.ingestion_worker"]
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      METRICS_PORT: "9101"
    networks: [kbs-data, kbs-aws, kbs-obs]
    ports:
      - "127.0.0.1:9101:9101"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  webhook-receiver:
    <<: *backend
    command: ["python", "-m", "backend.workers.webhook_receiver"]
    networks: [kbs-sources, kbs-obs]
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  kbs-data:
    external: true
    name: kbs-data
  kbs-sources:
    external: true
    name: kbs-sources
  kbs-aws:
    external: true
    name: kbs-aws
  kbs-obs:
    external: true
    name: kbs-obs
