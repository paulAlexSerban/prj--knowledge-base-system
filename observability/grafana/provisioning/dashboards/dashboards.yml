apiVersion: 1

providers:
  - name: kbs
    folder: KBS
    type: file
    # UI saves go to Grafana's database. Export the JSON and commit it under
    # observability/grafana/dashboards/. One file per dashboard:
    # kbs-overview, kbs-ingestion, kbs-retrieval-access, kbs-platform.
    allowUiUpdates: true
    disableDeletion: false
    options:
      path: /var/lib/grafana/dashboards
