apiVersion: 1

providers:
  - name: kbs
    folder: KBS
    type: file
    # UI saves go to Grafana's database. Export the JSON and commit it under
    # observability/grafana/dashboards/. The file is kbs-overview.json.
    allowUiUpdates: true
    disableDeletion: false
    options:
      path: /var/lib/grafana/dashboards
