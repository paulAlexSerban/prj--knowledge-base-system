apiVersion: 1

providers:
  - name: kbs
    # One folder. Subdirectories stay in git so the files are grouped.
    # They are not Grafana folders. UI edits are not written back.
    type: file
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
