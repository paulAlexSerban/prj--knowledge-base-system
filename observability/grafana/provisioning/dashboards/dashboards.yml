apiVersion: 1

providers:
  - name: kbs
    # foldersFromFilesStructure places each subdirectory in its own folder.
    # The directory names are overview, ingestion, retrieval-access, and platform.
    # UI edits are not written back. Change the JSON and commit it.
    folder: KBS
    type: file
    allowUiUpdates: false
    disableDeletion: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
