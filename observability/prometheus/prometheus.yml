global:
  scrape_interval: 15s

# Application targets are scraped by Alloy and remote-written here.
# Prometheus itself scrapes the collector and the log store.
# Jupyter has no /metrics endpoint and is not a target. It is a local authoring tool.
scrape_configs:
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
