global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# Application targets, including chat-ui:9105, are scraped by Alloy and remote-written here.
# Tempo's metrics generator also remote-writes service-graph and span-metrics series here.
# Prometheus itself scrapes the collector, the log store, and its own /metrics.
# Jupyter, pgAdmin, and the SQLite viewers have no /metrics endpoint and are not targets.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
