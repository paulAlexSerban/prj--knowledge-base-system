global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway-api
    static_configs:
      - targets: ["gateway-api:8000"]
  - job_name: gateway-mcp
    static_configs:
      - targets: ["gateway-mcp:8001"]
  - job_name: connector-worker
    static_configs:
      - targets: ["connector-worker:9100"]
  - job_name: ingestion-worker
    static_configs:
      - targets: ["ingestion-worker:9101"]
  - job_name: webhook-receiver
    static_configs:
      - targets: ["webhook-receiver:8090"]
  - job_name: harness-hr
    static_configs:
      - targets: ["harness-hr:8080"]
  - job_name: harness-sales
    static_configs:
      - targets: ["harness-sales:8080"]
  - job_name: harness-product
    static_configs:
      - targets: ["harness-product:8080"]
  - job_name: harness-engineering
    static_configs:
      - targets: ["harness-engineering:8080"]
