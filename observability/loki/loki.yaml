# Single-process Loki with filesystem storage. Built tier.
# Production path: object storage on the floci S3 bucket. See ADR 0002.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Loki would otherwise copy level into detected_level and service into
  # service_name. The label set is the four names in ADR 0002.
  discover_log_levels: false
  discover_service_name: []

analytics:
  reporting_enabled: false
