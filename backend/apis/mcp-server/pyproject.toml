[project]
name = "mcp-server"
version = "0.1.0"
description = "Knowledge gateway MCP server."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3.0",
  "prometheus-client>=0.26.0",
  "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
