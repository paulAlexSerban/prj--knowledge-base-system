[project]
name = "gateway-core"
version = "0.1.0"
description = "Shared retrieval service, principal, and tool descriptions for the gateway."
requires-python = ">=3.12"
dependencies = [
  "knowledge-store",
  "neomodel>=7.0.0",
  "pyjwt>=2.10",
  "pyyaml>=6",
  "shared",
]

[tool.uv.sources]
knowledge-store = { workspace = true }
shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
