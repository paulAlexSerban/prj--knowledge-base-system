[project]
name = "knowledge-store"
version = "0.1.0"
description = "Chunk, embed, and write Postgres and Neo4j from a change event."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.111",
  "ingest-contract",
  "neo4j>=5",
  "prometheus-client>=0.26.0",
  "psycopg[binary]>=3.3.6",
  "shared",
  "sqlalchemy>=2.1.4",
]

[tool.uv.sources]
ingest-contract = { workspace = true }
shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
