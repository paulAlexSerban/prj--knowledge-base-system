[project]
name = "ingest-contract"
version = "0.1.0"
description = "Change events, queue names, and the snapshot content hash."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
