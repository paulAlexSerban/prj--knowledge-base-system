[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Ingestion worker. Checks the tier queues and idles until chunking exists."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.111",
  "ingest-contract",
  "prometheus-client>=0.26.0",
  "shared",
]

[tool.uv.sources]
ingest-contract = { workspace = true }
shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
