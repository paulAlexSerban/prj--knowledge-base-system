[project]
name = "connector-sales"
version = "0.1.0"
description = "Sales connector. Reads the cursor feed and writes raw snapshots."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.111",
  "connector-core",
  "httpx>=0.28.1",
  "ingest-contract",
  "prometheus-client>=0.26.0",
  "psycopg[binary]>=3.3.6",
  "shared",
  "sqlalchemy>=2.1.4",
]

[tool.uv.sources]
connector-core = { workspace = true }
ingest-contract = { workspace = true }
shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
