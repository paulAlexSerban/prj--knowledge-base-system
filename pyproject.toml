[project]
name = "knowledge-base-system"
version = "0.1.0"
description = "Unified knowledge gateway POC"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev", "notebooks"]

[dependency-groups]
dev = [
  "moto[s3]>=5.2.3",
  "pytest>=8",
  "ruff>=0.6",
  "shared",
  "ingest-contract",
  "connector-core",
  "knowledge-store",
  "gateway-core",
  "connector-hr",
  "connector-engineering",
  "knowledge-api",
  "mcp-server",
  "webhook-receiver",
  "ingestion-worker",
  "harness-common",
  "harness-hr",
  "harness-sales",
  "harness-product",
  "harness-engineering",
  "chat-ui",
]
notebooks = [
  "boto3>=1.43.111",
  "httpx>=0.28.1",
  "jupyter>=1.1",
  "mcp>=2.3.0",
]

[tool.uv.workspace]
members = [
  "shared",
  "backend/libs/ingest-contract",
  "backend/libs/connector-core",
  "backend/libs/knowledge-store",
  "backend/libs/gateway-core",
  "backend/apis/knowledge-api",
  "backend/apis/mcp-server",
  "backend/apis/webhook-receiver",
  "backend/workers/ingestion-worker",
  "backend/connectors/hr",
  "backend/connectors/engineering",
  "demo-harness/common",
  "demo-harness/hr",
  "demo-harness/sales",
  "demo-harness/product",
  "demo-harness/engineering",
  "frontend",
]

[tool.uv.sources]
shared = { workspace = true }
ingest-contract = { workspace = true }
connector-core = { workspace = true }
knowledge-store = { workspace = true }
gateway-core = { workspace = true }
connector-hr = { workspace = true }
connector-engineering = { workspace = true }
knowledge-api = { workspace = true }
mcp-server = { workspace = true }
webhook-receiver = { workspace = true }
ingestion-worker = { workspace = true }
harness-common = { workspace = true }
harness-hr = { workspace = true }
harness-sales = { workspace = true }
harness-product = { workspace = true }
harness-engineering = { workspace = true }
chat-ui = { workspace = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = [
  "shared",
  "ingest_contract",
  "connector_core",
  "knowledge_store",
  "gateway_core",
  "connector_hr",
  "connector_engineering",
  "knowledge_api",
  "mcp_server",
  "webhook_receiver",
  "ingestion_worker",
  "harness_common",
  "harness_hr",
  "harness_sales",
  "harness_product",
  "harness_engineering",
  "chat_ui",
]

[tool.pytest.ini_options]
testpaths = [
  "shared/tests",
  "shared/src/shared/contracts/tests",
  "backend/libs/ingest-contract/tests",
  "backend/libs/connector-core/tests",
  "backend/libs/knowledge-store/tests",
  "backend/libs/gateway-core/tests",
  "backend/apis/knowledge-api/tests",
  "backend/apis/mcp-server/tests",
  "backend/connectors/hr/tests",
  "backend/connectors/engineering/tests",
  "backend/workers/ingestion-worker/tests",
  "backend/tests/integration",
  "demo-harness/hr/tests",
  "demo-harness/engineering/tests",
  "demo-harness/sales/tests",
  "demo-harness/product/tests",
  "demo-harness/common/tests",
  "notebooks/tests",
  "frontend/tests",
]
markers = [
  "e2e: requires the live compose stack",
]
addopts = "-m 'not e2e'"
