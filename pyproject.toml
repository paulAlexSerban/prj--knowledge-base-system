[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base-system"
version = "0.1.0"
description = "Unified knowledge gateway POC"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "email-validator>=2",
  "pyyaml>=6",
]

[dependency-groups]
backend = [
    "boto3>=1.43.111",
    "fastapi>=0.143.0",
    "mcp>=2.3.0",
    "neo4j>=6.4.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
harness = [
    "fastapi>=0.143.0",
    "prometheus-client>=0.26.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["shared/contracts/tests", "backend/tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev", "backend", "harness"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["shared", "backend"]
